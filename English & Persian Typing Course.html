<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آموزش تایپ انگلیسی و فارسی</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b7a75">
<style>
:root{--bg:#eaf1f2;--card:#fff;--ink:#10262e;--mute:#587078;--line:#cfdcdf;--acc:#0b7a75;--onacc:#fff;--bad:#c2410c;--cur:#ffd96b;--ok:#0b7a75;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.7rem;font-weight:800}
header p{margin:2px 0 8px;color:var(--mute)}
.tabs{display:flex;gap:8px}
.tabs button{all:unset;cursor:pointer;padding:6px 18px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
main{max-width:1100px;margin:auto;padding:8px 16px 32px;display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;max-height:80vh;overflow:auto}
aside summary{cursor:pointer;font-weight:600;padding:8px 0}
@media(min-width:821px){aside summary{display:none}aside{position:sticky;top:8px}}
h3{margin:14px 0 4px;font-size:1rem;color:var(--acc)}
.ls{display:flex;flex-direction:column;gap:2px}
.ls button{all:unset;text-align:start;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.4}
.ls button:hover{background:var(--bg)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ls button.on{background:var(--acc);color:var(--onacc)}
.ls small{white-space:nowrap}
section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#ttl{margin:0 0 10px;font-size:1.05rem;font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stats div{flex:1 1 90px;background:var(--bg);border-radius:10px;padding:6px 10px;text-align:center}
.stats b{display:block;font-size:1.3rem;font-weight:800}
.stats span{font-size:.78rem;color:var(--mute)}
#bw{position:relative}
#box{position:relative;font:500 1.45rem/2.1 "Roboto Mono",Consolas,"Courier New",monospace;border:2px solid var(--line);border-radius:10px;padding:10px 16px;cursor:text;height:200px;overflow-y:auto}
#box.fa{font:500 1.6rem/2.3 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
#bw:focus-within #box{border-color:var(--acc)}
.w{display:inline-block;white-space:pre}
.c{color:#000}
.c.ok{color:#16a34a}
.c.cur{background:var(--cur);color:#000;border-radius:4px}
.c.bad{color:#dc2626;background:#fee2e2;border-radius:4px}
#cap{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
#hint{margin:10px 0;color:var(--mute);min-height:1.7em}
#kb{direction:ltr;display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:8px;user-select:none}
.r{display:flex;gap:5px}
.k{width:clamp(22px,6.4vw,46px);height:clamp(26px,7vw,46px);border-radius:7px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font:500 clamp(.7rem,2.4vw,1rem) Vazirmatn,Tahoma,"Roboto Mono",monospace}
.k.sp{width:clamp(130px,40vw,280px)}
.k.nx{background:var(--cur);color:var(--ink);border-color:var(--ink);transform:translateY(2px)}
.f0{border-bottom:4px solid #d9486e}.f1{border-bottom:4px solid #e08a1e}.f2{border-bottom:4px solid #c9b000}.f3{border-bottom:4px solid #3aa655}
.f4{border-bottom:4px solid #2c9bb8}.f5{border-bottom:4px solid #4a6fd6}.f6{border-bottom:4px solid #8a5bd0}.f7{border-bottom:4px solid #c056a8}
.row2{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--acc);color:var(--onacc);padding:8px 18px;border-radius:9px;font-weight:600}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#res{display:none;margin-top:14px;border:2px solid var(--acc);border-radius:12px;padding:14px;text-align:center}
#res.show{display:block}
#res h2{margin:0 0 4px;font-size:1.25rem}
#stars{font-size:1.8rem;letter-spacing:4px;color:#e0a800}
footer{max-width:1100px;margin:auto;padding:0 16px 24px;color:var(--mute);font-size:.85rem}
.who{font-weight:800;font-size:1.2rem;color:var(--acc);letter-spacing:.06em;margin:2px 0 4px}
.mute{color:var(--mute)}
.btn.big{display:inline-block;font-size:1.2rem;padding:12px 28px;margin:8px 0}
#play{display:none}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.bar b{color:var(--acc)}
.panel.full{position:fixed;inset:0;z-index:50;border-radius:0;border:0;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel.full #play{display:flex;flex-direction:column;min-height:100%}
.panel.full #intro{display:none}
.panel.full #box{height:auto;max-height:none;overflow:visible;font-size:clamp(2.2rem,7vw,3.6rem);line-height:2}
.panel.full #box.fa{font-size:clamp(2.4rem,7.5vw,3.8rem);line-height:2.2}
#bw{flex:1}
.panel.full #box{font-weight:800}
#dock{position:sticky;bottom:0;margin-top:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
#dock #hint{margin:2px 0 4px;font-size:.9rem}
#dock .row2{margin-top:6px;justify-content:center}
.panel.full.fin #bw,.panel.full.fin #dock{display:none}
#res .stats{margin:14px 0}
html[lang="en"] body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#dock #kb,#dock .r{gap:3px}
#dock .k{width:clamp(17px,5.3vw,34px);height:clamp(22px,5.6vw,32px);font-size:clamp(.62rem,2.1vw,.85rem);border-radius:6px}
#dock .k.sp{width:clamp(110px,34vw,220px)}
#dock .btn{padding:6px 14px;font-size:.9rem}
</style>
</head>

<header>
  <h1 data-i="h1">آموزش تایپ انگلیسی و فارسی</h1>
  <div id="who" class="who" dir="auto"></div>
  <p data-i="sub">از ردیف اصلی شروع کنید و قدم به قدم تا تایپ سریع و بدون خطا پیش بروید.</p>
  <div class="tabs"><button id="tEn">English Typing</button><button id="tFa">تایپ فارسی</button></div>
</header>
<main>
  <aside><details id="menu" open><summary data-i="menu">فهرست درس‌ها</summary><div id="list"></div></details></aside>
  <section class="panel" id="pn">
    <div id="intro"><h2 id="ttl" dir="auto"></h2><p id="best" class="mute"></p>
      <button class="btn big" id="go" data-i="go">▶ شروع تمرین</button>
      <p class="mute" data-i="goNote">با زدن این دکمه، یک صفحه بزرگ برای تمرین باز می‌شود.</p>
      <div class="row2"><button class="btn alt snd">🔊 صدا روشن</button><button class="btn alt kbt">⌨ کیبورد روشن</button></div></div>
    <div id="play">
      <div class="bar"><b id="who2" dir="auto"></b><span id="ttl2" dir="auto"></span><button class="btn alt" id="close" data-i="close">✕ بستن</button></div>
      <div id="bw"><div id="box"><div id="txt"></div></div>
        <input id="cap" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="اینجا تایپ کنید"></div>
      <div id="res"><h2 id="rt"></h2><div id="stars"></div>
        <div class="stats">
          <div><b id="sT">0:00</b><span data-i="lT">زمان</span></div>
          <div><b id="sA">100%</b><span data-i="lA">دقت</span></div>
          <div><b id="sW">0</b><span data-i="lW">سرعت (WPM)</span></div>
          <div><b id="sE">0</b><span data-i="lE">اشتباه</span></div>
          <div><b id="sP">0%</b><span data-i="lP">پیشرفت دوره</span></div>
        </div>
        <p id="rd"></p>
        <div class="row2" style="justify-content:center"><button class="btn alt" id="again" data-i="again">تکرار درس</button><button class="btn" id="next" data-i="btnNext">درس بعدی</button></div></div>
      <div id="dock"><div id="hint" data-i="hint0">روی صفحه بزنید و شروع به تایپ کنید.</div><div id="kb"></div>
        <div class="row2"><button class="btn alt" id="restart" data-i="restart">شروع دوباره (Esc)</button><button class="btn alt snd">🔊 صدا روشن</button><button class="btn alt kbt">⌨ کیبورد روشن</button></div></div>
    </div>
  </section>
</main>

const STORIES={en:{f:"fiona and her father lived in a small farm house far from the city. every friday, fiona fed the chickens, fixed the fence, and filled the water for the four fat sheep. her father, frank, was a fisherman before he became a farmer, and he often told her fine stories about the fast river and the fish he found there. one foggy morning, fiona found a funny little box near the fence. the box was soft and warm, and inside it was a fluffy fox cub. the cub was so small that it fit in her hand. fiona felt a flutter in her heart. she ran to find her father and cried, father, father, i found a friend. frank frowned at first, for a fox is a wild animal, and a farm full of hens is not a safe place for a fox. but when he saw the frightened face of the cub, his heart softened. we will feed him for a few days, said frank, and when he is strong, we will set him free. fiona was fine with that plan. she named the cub fudge, for his fur was the color of fresh fudge. every morning fiona fetched fresh milk, and every afternoon she found fruit and food for fudge. the fox grew faster than anyone had foreseen. in a few weeks he followed her around the field, and he fell asleep at her feet by the fire. but one frosty friday, fudge was gone. the door of the shed was open, and a trail of small footprints led to the forest. fiona felt her stomach fall. she fought back tears and followed the footprints, past the frozen fountain, past the old fig tree, and far into the dark forest. the wind was fierce and the fog grew thicker, but she did not stop. at last, in a quiet field of ferns, she saw fudge. he was not alone. beside him stood a large female fox, and two little cubs played near her feet. fudge looked at fiona, and for a moment the whole forest felt still. then he gave a soft, friendly cry, as if to say, thank you for everything, my friend. fiona smiled through her tears. she understood now that fudge had found his family. she waved a last farewell and walked home slowly, feeling both sad and full of joy. when she told her father, frank hugged her tight. you did the right thing, he said, because real friendship means setting free the one you love. from that day on, fiona left a little food at the edge of the forest each friday. and every spring, as the first flowers opened and the fog lifted, she would see a fox with a fluffy tail watching from far away, and she knew that her friend had never forgotten her."},fa:{"ب":"بهار بود و باغ بزرگ بابا پر از بوی گل بود. بهرام پسر کوچک باغبان بود و هر روز با بابا به باغ می رفت. بابا به او می گفت بهرام باغ مثل یک کتاب است و هر برگ باغ یک درس برای ما دارد. بهرام این حرف ها را دوست داشت و با دقت به باغ نگاه می کرد. یک روز صبح بهرام زیر درخت بادام یک بلبل کوچک دید. بال بلبل زخمی بود و بدن او می لرزید. بهرام با مهربانی بلبل را برداشت و به خانه برد. بابا گفت بیمار را باید با صبر نگه داری کرد. بهرام برای بلبل یک لانه ساخت و با برگ و پنبه لانه را نرم کرد. بعد کمی شیر و دانه برای او گذاشت. هر روز بعد از مدرسه بهرام به بلبل سر می زد. بلبل کم کم بهتر شد و بعد از چند هفته بال های او قوی شد. بهرام برای بلبل بازی می کرد و بلبل برای او نغمه می خواند. نغمه بلبل مثل باران بهاری بود و دل بهرام را شاد می کرد. بابا هم هر وقت این نغمه را می شنید لبخند می زد. تابستان رسید و باغ پر از میوه شد. بلبل حالا می توانست به بالای ابرها برود ولی هر بار به باغ برمی گشت. یک روز بهرام به بابا گفت بلبل باید به خانه خودش برود. بابا گفت بله بچه من پرنده باید رها باشد. بهرام کمی غصه خورد ولی می دانست که بابا درست می گوید. صبح بعد بهرام بلبل را به بالای بلندترین تپه برد. باد ملایم می وزید و هوا پاک بود. بهرام دست خود را باز کرد و گفت برو بلبل عزیز و به سلامت باش. بلبل لحظه ای به او نگاه کرد و بعد بال زد و بالا رفت. بهرام تا مدت ها به او نگاه کرد تا بلبل میان ابرها گم شد. همان شب بهرام با غم به خانه برگشت ولی بابا در را باز کرد و گفت بهرام بیا ببین. روی شاخه بادام بلبل نشسته بود و برای او نغمه می خواند. بهرام با خوشحالی خندید و فهمید که دوستی واقعی هیچ وقت از بین نمی رود. از همان روز هر بهار بلبل به باغ برمی گشت و بهرام و بابا با هم fa:["من هر روز تایپ می کنم.","او کتاب خوب می خواند.","ما به مدرسه می رویم.","هوا امروز خیلی سرد است.","مادر نان تازه پخت.","پدر من در باغ کار می کند.","کودک گل سرخ را دوست دارد.","دوست خوب مثل برادر است.","ما با هم به شهر رفتیم.","بچه ها در حیاط بازی می کنند.","سیب سرخ و شیرین است.","او یک گربه سفید دارد.","هر روز صبح شیر می نوشم.","درخت بزرگ سایه زیبا دارد.","من به دوستم نامه نوشتم.","کلید را روی میز گذاشتم.","پرنده بر شاخه درخت نشست.","ما شب ها کتاب می خوانیم.","دانش بهترین هدیه برای همه است.","تلاش و صبر کلید پیروزی است.","سرعت خوب با تمرین حاصل می شود.","هر کس صبر کند به هدف می رسد.","گل ها در بهار می رویند.","پیرمرد با نوه اش قدم می زد.","خانه ما کنار رود بزرگ است.","ماه شب ها بالای کوه می درخشد.","او با دقت نامه را خواند.","برادر کوچک من سیب دوست دارد.","دوستان خوب همیشه کنار هم هستند.","کودکان باید هر روز بازی کنند و درس بخوانند.","ساعت سه بعد از ظهر به خانه رسیدم.","هوای پاک برای همه خوب است.","پروانه روی گل نشست.","گوسفند در دشت می چرد.","نان و پنیر و سبزی غذای خوب است.","هر روز یک کار نیک انجام بده."]};
function gen(l){
  if(l.story)return clean(STORIES[lang][l.story]||makeStory(lang,l.story));
  if(l.text)return l.text;
  const P=l.pool.split("").map(tl),Fc=(l.focus||"").split("").map(tl),inP=w=>[...w].every(c=>P.includes(c));
  const WL=(fa()?WF.concat(WX.fa):WE.concat(WX.en)).filter(inP);
  const SL=SN[lang].filter(s=>inP(s.replace(/[ .]/g,"")));
  if(l.k!=="intro"&&WL.length>=4){
    const FW=Fc[0]?WL.filter(w=>Fc.some(c=>w.includes(c))):WL;
    const pick=()=>{const src=FW.length>=4&&Math.random()<.7?FW:WL;return src[rnd(src.length)]};
    const sen=s=>P.includes(".")?s:s.replace(/\./g,"");
    const out=[],pS=l.k==="prac"?.2:.4;let c=0;
    while(c<l.w){if(SL.length&&Math.random()<pS){const s=sen(SL[rnd(SL.length)]);out.push(s);c+=s.split(" ").length}else{const n=4+rnd(4);for(let i=0;i<n;i++)out.push(pick());c+=n}}
    return out.join(" ");
  }
  const useReal=WL.length>=6&&l.k!=="intro",w=[];
  for(let i=0;i<l.w;i++){
    if(useReal&&(l.real||Math.random()<.5)){w.push(WL[rnd(WL.length)]);continue}
    const len=l.k==="intro"?rnd(2)+2:rnd(3)+3;let x="";
    for(let j=0;j<len;j++)x+=P[rnd(P.length)];
    if(Fc[0]&&!Fc.some(c=>x.includes(c)))x=x.slice(0,-1)+Fc[rnd(Fc.length)];
    w.push(x)}
  return w.join(" ");
}
const key=()=>"tp2-"+lang;
function save(){try{localStorage.setItem(key(),JSON.stringify(prog))}catch(e){}}
function loadProg(){prog={};try{prog=JSON.parse(localStorage.getItem(key())||"{}")}catch(e){}}
function buildList(){
  $("list").innerHTML=`<button class="btn" id="goSt" style="margin:8px 0">📖 ${fa()?"داستان‌ها":"Stories"}</button>`+S.map(x=>`<h3${x.ls[0]&&x.ls[0].story?' id="stH"':''}>${x.n}</h3><div class="ls">`+x.ls.map(l=>{const p=prog[l.id];
    return `<button data-i="${l.id}" class="${l.id===cur?"on":""}"><span>${l.n}. ${l.t}</span><small>${p?("★".repeat(p.stars)||"·"):""}</small></button>`}).join("")+`</div>`).join("");
  $("list").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{load(+b.dataset.i);if(innerWidth<=820)$("menu").open=false});
  $("goSt").onclick=()=>$("stH").scrollIntoView({block:"start"});
}
function buildKb(){
  const R=fa()?["qwertyuiop[]","asdfghjkl;'","zxcvbnm,./"]:["1234567890","qwertyuiop","asdfghjkl;","zxcvbnm,./"];
  $("kb").innerHTML=R.map((r,i)=>`<div class="r" style="margin-inline-start:${(fa()?i+1:i)*10}px">`+r.split("").map(c=>{const m=tl(c);return `<div class="k f${FP[c]}" data-k="${m}">${m}</div>`}).join("")+`</div>`).join("")+`<div class="r"><div class="k sp" data-k=" ">${fa()?"فاصله":"space"}</div></div>`;
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function load(i){
  cur=i;const l=ALL[i];text=gen(l);pos=0;ok=0;err=0;t0=0;done=false;wrong=false;st=[];clearInterval(tm);
  const tt=(fa()?"درس ":"Lesson ")+l.n+": "+l.t;$("ttl").textContent=tt;$("ttl2").textContent=tt;showBest();$("res").classList.remove("show");$("pn").classList.remove("fin");$("pn").scrollTop=0;
  $("box").className=fa()?"fa":"";$("txt").dir=fa()?"rtl":"ltr";$("box").scrollTop=0;
  $("txt").innerHTML=text.split(" ").map((w,wi,a)=>`<span class="w">`+(w+(wi<a.length-1?" ":"")).split("").map(c=>`<span class="c">${c}</span>`).join("")+`</span>`).join("");
  chars=[...document.querySelectorAll("#txt .c")];
  upd();buildList();$("cap").focus({preventScroll:true});
}
function upd(){
  chars.forEach((c,i)=>{c.className="c"+(i<pos?(st[i]===2?" bad":" ok"):i===pos?" cur":"")});
  const nx=text[pos];
  document.querySelectorAll(".k.nx").forEach(k=>k.classList.remove("nx"));
  if(nx!==undefined){const k=document.querySelector(`.k[data-k="${CSS.escape(nx)}"]`);if(k)k.classList.add("nx");
    const f=nx===" "?T[lang].thumb:(fa()?FN:FNE)[fing(nx)]||"";
    $("hint").textContent=T[lang].nk+(nx===" "?T[lang].space:nx)+(f?" — "+T[lang].finger+f:"");
    const c=chars[pos];if(c&&playing){const vv=window.visualViewport,vt=vv?vv.offsetTop:0,vh=vv?vv.height:window.innerHeight,r=c.getBoundingClientRect(),dk=$("dock").getBoundingClientRect().top,lim=Math.min(dk,vt+vh)-40;if(r.bottom>lim)$("pn").scrollTop+=r.top-(vt+vh*0.3)}}
  const sec=t0?(Date.now()-t0)/1000:0,w=sec>1?Math.round(ok/5/(sec/60)):0;
  $("sW").textContent=w;$("sA").textContent=(ok+err?Math.round(ok/(ok+err)*100):100)+"%";
  $("sT").textContent=fmt(sec);$("sP").textContent=Math.round(pos/text.length*100)+"%";
}
function press(ch){
  if(done||!playing)return;if(!t0){t0=Date.now();tm=setInterval(upd,300)}
  if(ch===text[pos]){beep(1);st[pos]=1;ok++}else{beep(0);st[pos]=2;err++}
  pos++;if(pos>=text.length)return finish();
  upd();
}
function finish(){
  done=true;clearInterval(tm);upd();
  const sec=Math.max((Date.now()-t0)/1000,3),wpm=Math.round(ok/5/(sec/60)),acc=Math.round(ok/(ok+err)*100);
  const st=acc>=97?3:acc>=92?2:acc>=85?1:0;
  const old=prog[cur];if(!old||st>old.stars||(st===old.stars&&wpm>old.wpm))prog[cur]={stars:st,wpm,acc};save();
  $("rt").textContent=st?T[lang].pass:T[lang].fail;
  $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("sT").textContent=fmt(sec);$("sA").textContent=acc+"%";$("sW").textContent=wpm;$("sE").textContent=err;
  const dn=ALL.filter(l=>prog[l.id]&&prog[l.id].stars>0).length;$("sP").textContent=Math.round(dn/ALL.length*100)+"%";
  const dw=old?wpm-old.wpm:0,da=old?acc-old.acc:0,sg=x=>(x>0?"+":"")+x;
  $("rd").textContent=T[lang].rd(old,dw,da,dn,ALL.length,st);
  $("pn").classList.add("fin");$("pn").scrollTop=0;
  $("next").style.display=cur<ALL.length-1?"":"none";
  $("res").classList.add("show");buildList();
}
function showBest(){const p=prog[cur];$("best").textContent=p?T[lang].best(p):T[lang].nobest}
function start(){playing=true;$("pn").classList.add("full");document.body.style.overflow="hidden";load(cur)}
function stop(){playing=false;clearInterval(tm);$("pn").classList.remove("full");document.body.style.overflow="";showBest();buildList();window.scrollTo(0,0)}
function setLang(l){
  lang=l;document.documentElement.dataset.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="fa"?"rtl":"ltr";const nm=l==="fa"?"صفی الله منصوری":"SAFIULLAH MANSORI";$("who").textContent=nm;$("who2").textContent=nm;
  $("tEn").classList.toggle("on",l==="en");$("tFa").classList.toggle("on",l==="fa");
  applyUI();
  build();loadProg();buildKb();
  let f=0;for(let i=0;i<ALL.length;i++){if(!prog[i]||!prog[i].stars){f=i;break}}
  load(f);
}
$("cap").addEventListener("input",e=>{const v=e.target.value;e.target.value="";for(const c of v)press(fa()?c:c.toLowerCase())});
$("cap").addEventListener("keydown",e=>{if(e.key==="Escape")load(cur)});
$("bw").addEventListener("click",()=>$("cap").focus({preventScroll:true}));
$("restart").onclick=()=>load(cur);$("again").onclick=()=>load(cur);$("next").onclick=()=>load(cur+1);
const sndTxt=()=>document.querySelectorAll(".snd").forEach(b=>b.textContent=muted?T[lang].sndOff:T[lang].sndOn);sndTxt();
document.querySelectorAll(".snd").forEach(b=>b.onclick=()=>{muted=!muted;try{localStorage.setItem("tp2-mute",muted?"1":"0")}catch(e){}sndTxt()});
let kbShow=true;try{kbShow=localStorage.getItem("tp2-kb")!=="0"}catch(e){}
const kbTxt=()=>{document.querySelectorAll(".kbt").forEach(b=>b.textContent=kbShow?T[lang].kbOn:T[lang].kbOff);$("kb").style.display=kbShow?"":"none"};kbTxt();
document.querySelectorAll(".kbt").forEach(b=>b.onclick=()=>{kbShow=!kbShow;try{localStorage.setItem("tp2-kb",kbShow?"1":"0")}catch(e){}kbTxt();$("cap").focus({preventScroll:true})});
$("tEn").onclick=()=>setLang("en");$("tFa").onclick=()=>setLang("fa");$("go").onclick=start;$("close").onclick=stop;
if(innerWidth<=820)$("menu").open=false;
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
setLang("en");
